[project]
name = "medimate-api"
version = "0.1.0"
description = "FastAPI backend for MediMate"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "starlette>=0.47,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

